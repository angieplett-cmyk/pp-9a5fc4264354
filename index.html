<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Pod Points 🚀</title>
<style>
:root{--ink:#3D2C29;--cream:#FFF8F0;--pump:#7B5CFF;--leaf:#2E3A7A;--gold:#F5B83D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Nunito","Avenir Next",system-ui,sans-serif;background:#141B3D radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#fff,transparent),radial-gradient(2px 2px at 220px 150px,#cfd8ff,transparent);background-size:260px 200px;color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;background:#fff;border-bottom:4px solid var(--pump);position:sticky;top:0;z-index:5}
h1{margin:0 12px 0 0;font-size:28px}
button{font:inherit;border:0;border-radius:16px;cursor:pointer;min-height:52px;padding:8px 16px;font-weight:800;font-size:18px}
.blk{background:#F3E6D6;color:var(--ink)}.blk.on{background:var(--pump);color:#fff}
.tool{background:var(--leaf);color:#fff}
#goal{flex-basis:100%;font-size:18px;font-weight:700}
.bar{height:14px;background:#eee;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--pump))}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:16px}
.pod{border-radius:24px;padding:14px;border:3px solid #0001;box-shadow:0 4px 0 #0001}
.top{display:flex;justify-content:space-between;align-items:center}
.pod h2{margin:0;font-size:24px}.pts{font-size:46px;font-weight:900}
.kids{font-size:17px;margin:4px 0 8px;line-height:1.35}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rs button{background:#fff;font-size:17px}
.rs button:active{transform:scale(.95)}
.low{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.reset{background:#fff3;border:2px dashed #0003;color:var(--ink);font-size:16px}
.earn{background:var(--gold);color:#fff;font-size:16px}
.stat{font-size:15px;font-weight:700}
dialog{border:0;border-radius:24px;max-width:640px;width:92%;padding:22px;font-size:18px}
dialog::backdrop{background:#0006}
.rw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;gap:8px}
input,select{font:inherit;font-size:18px;padding:10px;border-radius:12px;border:2px solid #ddd}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:20px;font-size:20px;font-weight:800;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
.small{font-size:14px;opacity:.8}
</style></head><body>
<header><h1>🚀 Pod Points</h1><span id="blocks"></span>
<button class="tool" onclick="undo()">↶ Undo</button>
<button class="tool" onclick="openRewards()">🎁 Rewards</button>
<button class="tool" onclick="weekly()">🌅 New Week</button>
<button class="tool" onclick="openTeacher()">🔒 Teacher</button>
<div id="goal"></div></header>
<main id="pods"></main>
<dialog id="dlg"></dialog><div id="toast"></div>
<script>
const ROSTER={"1": {"label": "B1 \u00b7 Plett", "pods": [{"name": "Pod 1", "kids": ["Pod 1 Seat 1", "Pod 1 Seat 2", "Pod 1 Seat 3", "Pod 1 Seat 4"]}, {"name": "Pod 2", "kids": ["Pod 2 Seat 1", "Pod 2 Seat 2", "Pod 2 Seat 3", "Pod 2 Seat 4"]}, {"name": "Pod 3", "kids": ["Pod 3 Seat 1", "Pod 3 Seat 2", "Pod 3 Seat 3", "Pod 3 Seat 4"]}, {"name": "Pod 4", "kids": ["Pod 4 Seat 1", "Pod 4 Seat 2", "Pod 4 Seat 3", "Pod 4 Seat 4"]}, {"name": "Pod 5", "kids": ["Pod 5 Seat 1", "Pod 5 Seat 2", "Pod 5 Seat 3", "Pod 5 Seat 4"]}, {"name": "Pod 6", "kids": ["Pod 6 Seat 1", "Pod 6 Seat 2", "Pod 6 Seat 3", "Pod 6 Seat 4"]}, {"name": "Pod 7", "kids": ["Pod 7 Seat 1", "Pod 7 Seat 2", "Pod 7 Seat 3", "Pod 7 Seat 4"]}, {"name": "Star Desk", "kids": ["Star Desk Seat 1"]}]}, "2": {"label": "B2 \u00b7 Sedinger", "pods": [{"name": "Pod 1", "kids": ["Pod 1 Seat 1", "Pod 1 Seat 2", "Pod 1 Seat 3", "Pod 1 Seat 4"]}, {"name": "Pod 2", "kids": ["Pod 2 Seat 1", "Pod 2 Seat 2", "Pod 2 Seat 3"]}, {"name": "Pod 3", "kids": ["Pod 3 Seat 1", "Pod 3 Seat 2", "Pod 3 Seat 3", "Pod 3 Seat 4"]}, {"name": "Pod 4", "kids": ["Pod 4 Seat 1", "Pod 4 Seat 2", "Pod 4 Seat 3", "Pod 4 Seat 4"]}, {"name": "Pod 5", "kids": ["Pod 5 Seat 1", "Pod 5 Seat 2", "Pod 5 Seat 3", "Pod 5 Seat 4"]}, {"name": "Pod 6", "kids": ["Pod 6 Seat 1", "Pod 6 Seat 2", "Pod 6 Seat 3", "Pod 6 Seat 4"]}, {"name": "Pod 7", "kids": ["Pod 7 Seat 1", "Pod 7 Seat 2", "Pod 7 Seat 3"]}, {"name": "Pod 8", "kids": ["Pod 8 Seat 1", "Pod 8 Seat 2", "Pod 8 Seat 3"]}]}, "3": {"label": "B3 \u00b7 Nelson", "pods": [{"name": "Pod 1", "kids": ["Pod 1 Seat 1", "Pod 1 Seat 2", "Pod 1 Seat 3", "Pod 1 Seat 4"]}, {"name": "Pod 2", "kids": ["Pod 2 Seat 1", "Pod 2 Seat 2", "Pod 2 Seat 3", "Pod 2 Seat 4"]}, {"name": "Pod 3", "kids": ["Pod 3 Seat 1", "Pod 3 Seat 2", "Pod 3 Seat 3", "Pod 3 Seat 4"]}, {"name": "Pod 4", "kids": ["Pod 4 Seat 1", "Pod 4 Seat 2", "Pod 4 Seat 3", "Pod 4 Seat 4"]}, {"name": "Pod 5", "kids": ["Pod 5 Seat 1", "Pod 5 Seat 2", "Pod 5 Seat 3", "Pod 5 Seat 4"]}, {"name": "Pod 6", "kids": ["Pod 6 Seat 1", "Pod 6 Seat 2", "Pod 6 Seat 3", "Pod 6 Seat 4"]}, {"name": "Pod 7", "kids": ["Pod 7 Seat 1", "Pod 7 Seat 2", "Pod 7 Seat 3", "Pod 7 Seat 4"]}, {"name": "Pod 8", "kids": ["Pod 8 Seat 1", "Pod 8 Seat 2", "Pod 8 Seat 3"]}]}, "4": {"label": "B4 \u00b7 Stonebraker", "pods": [{"name": "Pod 1", "kids": ["Pod 1 Seat 1", "Pod 1 Seat 2", "Pod 1 Seat 3", "Pod 1 Seat 4"]}, {"name": "Pod 2", "kids": ["Pod 2 Seat 1", "Pod 2 Seat 2", "Pod 2 Seat 3", "Pod 2 Seat 4"]}, {"name": "Pod 3", "kids": ["Pod 3 Seat 1", "Pod 3 Seat 2", "Pod 3 Seat 3", "Pod 3 Seat 4"]}, {"name": "Pod 4", "kids": ["Pod 4 Seat 1", "Pod 4 Seat 2", "Pod 4 Seat 3", "Pod 4 Seat 4"]}, {"name": "Pod 5", "kids": ["Pod 5 Seat 1", "Pod 5 Seat 2", "Pod 5 Seat 3", "Pod 5 Seat 4"]}, {"name": "Pod 6", "kids": ["Pod 6 Seat 1", "Pod 6 Seat 2", "Pod 6 Seat 3", "Pod 6 Seat 4"]}, {"name": "Pod 7", "kids": ["Pod 7 Seat 1", "Pod 7 Seat 2", "Pod 7 Seat 3", "Pod 7 Seat 4"]}, {"name": "Pod 8", "kids": ["Pod 8 Seat 1", "Pod 8 Seat 2", "Pod 8 Seat 3", "Pod 8 Seat 4"]}]}};
const COLORS=["#E3E8FF","#F1E4FF","#DFF6FF","#FFE9F3","#E6FFF4","#FFF6D9","#E8ECF7","#FDE7DA","#EAF7FF","#F3EDFF"];const _old=["#FDE2E4","#E2ECE9","#FFF1D6","#E8DFF5","#DCEEF8","#FFE8D6","#E4F0D9","#F7F2EC","#FFF1D6"];
const CUTE=["🌙 Moon Crew","🪐 Saturn Rings","☄️ Comet Chasers","🌌 Galaxy Guardians","🚀 Rocket Squad","⭐ North Stars","🔭 Star Gazers","☀️ Solar Flares","🌍 Orbit Crew","👽 Nebula Ninjas"];
const pname=i=>(S.names&&S.names[key(i)])||CUTE[i%10];
const EMO=["🍎","🍁","🎃","🌻","🦉","🍄","🌰","🦊","⭐"];
const REASONS=["🤝 Teamwork","🎯 On task","💬 Kind words","🧹 Clean pod","🙋 Moving & thinking","🧠 Deep thinking"];
const DEF_REWARDS=[["Pod picks music",10],["Sit anywhere 1 day",15],["Teacher's chair 1 period",20],["Pod lunch with Mrs. Plett",30],["Extra recess 5 min",25]];
let S=JSON.parse(localStorage.getItem("podpoints")||"null")||{block:"1",pts:{},buf:{},warn:{},owed:{},hist:[],strikes:{},rewards:DEF_REWARDS,classGoal:20,day:"",adds:0,takes:0};
const save=()=>localStorage.setItem("podpoints",JSON.stringify(S));
const today=new Date().toDateString();
if(S.day!==today){S.buf={};S.warn={};S.owed={};S.day=today;save()}
const key=i=>S.block+":"+i;
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1600)}
function push(){S.hist.push(JSON.stringify({pts:S.pts,buf:S.buf,warn:S.warn,owed:S.owed,adds:S.adds,takes:S.takes}));if(S.hist.length>60)S.hist.shift()}
function add(i,r){push();S.pts[key(i)]=(S.pts[key(i)]||0)+1;S.adds++;save();render();toast("+1 "+r)}
function reset(i){push();const k=key(i);
 if(!S.warn[k]){S.warn[k]=1;toast("🟡 Gentle reminder, Pod — reset & refocus")}
 else if(!S.buf[k]){S.buf[k]=1;toast("🛡️ Buffer used — no points lost")}
 else{S.pts[k]=Math.max(0,(S.pts[k]||0)-1);S.owed[k]=(S.owed[k]||0)+1;S.warn[k]=0;S.takes++;toast("Pod reset −1 · you can earn it back!")}
 save();render()}
function earn(i){push();const k=key(i);S.owed[k]--;S.pts[k]=(S.pts[k]||0)+1;save();render();toast("🌟 Earned back!")}
function undo(){if(!S.hist.length)return toast("Nothing to undo");Object.assign(S,JSON.parse(S.hist.pop()));save();render();toast("↶ Undone")}
function weekly(){if(!confirm("Start a fresh week? All pod points in ALL blocks go to 0."))return;push();S.pts={};S.buf={};S.warn={};S.owed={};S.adds=0;S.takes=0;save();render();toast("🌅 Fresh start!")}
function render(){
 const B=ROSTER[S.block];
 document.getElementById("blocks").innerHTML=Object.keys(ROSTER).map(b=>`<button class="blk ${b==S.block?'on':''}" onclick="S.block='${b}';save();render()">${ROSTER[b].label}</button>`).join(" ");
 const tot=B.pods.reduce((a,p,i)=>a+(S.pts[key(i)]||0),0),goal=S.classGoal*B.pods.length;
 document.getElementById("goal").innerHTML=`🌠 Mission goal: ${tot} / ${goal} <div class="bar"><i style="width:${Math.min(100,tot/goal*100)}%"></i></div>`;
 document.getElementById("pods").innerHTML=B.pods.map((p,i)=>{const k=key(i);return `<section class="pod" style="background:${COLORS[i%10]}">
 <div class="top"><h2>${pname(i)} <span class="small">· ${p.name}</span></h2><div class="pts">${S.pts[k]||0}</div></div>
 <div class="kids">🪑 ${p.kids.length} seats</div>
 <div class="rs">${REASONS.map(r=>`<button onclick="add(${i},'${r}')">+ ${r}</button>`).join("")}</div>
 <div class="low"><button class="reset" onclick="reset(${i})">↺ Reset</button>
 ${S.owed[k]>0?`<button class="earn" onclick="earn(${i})">🌟 Earned back</button>`:""}
 <span class="stat">${S.warn[k]?"🟡 reminder":""} ${S.buf[k]?"🛡️ buffer used":"🛡️ buffer ready"}</span></div></section>`}).join("");
}
function openRewards(){const d=document.getElementById("dlg"),B=ROSTER[S.block];
 d.innerHTML=`<h2>🎁 Reward Menu</h2>${S.rewards.map((r,j)=>`<div class="rw"><b>${r[0]}</b><span>${r[1]} pts</span><select id="rp${j}">${B.pods.map((p,i)=>`<option value="${i}">${pname(i)} (${S.pts[key(i)]||0})</option>`).join("")}</select><button class="tool" onclick="buy(${j})">Spend</button><button onclick="S.rewards.splice(${j},1);save();openRewards()">✕</button></div>`).join("")}
 <p><input id="rn" placeholder="New reward"> <input id="rc" type="number" placeholder="pts" style="width:90px"> <button class="tool" onclick="if(rn.value&&rc.value){S.rewards.push([rn.value,+rc.value]);save();openRewards()}">Add</button></p>
 <p>Class goal per pod: <input type="number" value="${S.classGoal}" style="width:90px" onchange="S.classGoal=+this.value||20;save();render()"></p>
 <button class="tool" onclick="dlg.close()">Close</button>`;if(!d.open)d.showModal()}
function buy(j){const i=+document.getElementById("rp"+j).value,k=key(i),c=S.rewards[j][1];if((S.pts[k]||0)<c)return toast("Not enough points yet — keep going!");push();S.pts[k]-=c;save();render();openRewards();toast("🎉 "+pname(i)+": "+S.rewards[j][0])}
function openTeacher(){const d=document.getElementById("dlg"),B=ROSTER[S.block];const kids=B.pods.flatMap(p=>p.kids);
 const ratio=S.takes?(S.adds/S.takes).toFixed(1)+" : 1":"all positive 🎉";
 d.innerHTML=`<h2>🔒 Teacher only</h2><p class="small">Private check-in log. Never changes pod points and never shows on the main screen. Use it for a quiet talk with the student, not a public consequence.</p>
 <p><b>Positive : takeaway ratio this week:</b> ${ratio} <span class="small">(aim for 4:1 or more)</span></p>
<h3>Pod names</h3>${B.pods.map((p,i)=>`<div class="rw"><span>${p.name}</span><input class="pn" value="${pname(i)}" onchange="S.names=S.names||{};S.names[key(${i})]=this.value;save();render()"></div>`).join("")}<h3>Private check-ins</h3>${kids.map(n=>{const c=S.strikes[S.block+":"+n]||0;return `<div class="rw"><span>${n}</span><span>${"●".repeat(c)||"—"}</span><span><button onclick="st('${n.replace(/'/g,"\\'")}',1)">+ note</button> <button onclick="st('${n.replace(/'/g,"\\'")}',-1)">−</button></span></div>`}).join("")}
 <p><button onclick="if(confirm('Clear private notes for this block?')){Object.keys(S.strikes).filter(k=>k.startsWith(S.block+':')).forEach(k=>delete S.strikes[k]);save();openTeacher()}">Clear notes</button> <button class="tool" onclick="dlg.close()">Close</button></p>`;if(!d.open)d.showModal()}
function st(n,v){const k=S.block+":"+n;S.strikes[k]=Math.max(0,(S.strikes[k]||0)+v);save();openTeacher()}
render();
</script></body></html>
